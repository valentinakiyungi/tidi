# Runs Tidi in GitHub's cloud, so it works even when your Mac is off.
# Safe for a PUBLIC repo:
#   - your files come from encrypted secrets and are deleted after each run
#   - Tidi's memory is encrypted (TIDI_STATE_KEY) before it is stored between runs
#   - it only runs on its schedule or when you start it, never from pull requests
#   - Tidi prints no email contents or ntfy topic in these (public) logs
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TIDI_ENV            the whole contents of your .env file
#   GMAIL_CREDENTIALS   the contents of credentials.json
#   GMAIL_TOKEN         the contents of token.json
#   TIDI_STATE_KEY      a random password:  openssl rand -base64 32 | pbcopy
#   TIDI_STATE          optional: contents of state.json, used only if nothing is saved yet
#
# Times are UTC. Your timezone is UTC+3, so:
#   every 3 hours at :17  →  00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17
#   04:31 UTC             →  07:31, for the morning brief
name: Tidi

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "31 4 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: tidi
  cancel-in-progress: false

jobs:
  tidy:
    # Only run in your repo, never in someone else's copy of it.
    if: github.repository_owner == 'valentinakiyungi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Restore Tidi's memory (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: state.json.enc
          key: tidi-secure-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tidi-secure-

      - name: Write private files from secrets
        env:
          TIDI_ENV: ${{ secrets.TIDI_ENV }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          TIDI_STATE: ${{ secrets.TIDI_STATE }}
          TIDI_STATE_KEY: ${{ secrets.TIDI_STATE_KEY }}
        run: |
          missing=""
          for s in TIDI_ENV GMAIL_TOKEN TIDI_STATE_KEY; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Tidi::Missing secret(s):$missing. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s\n' "$TIDI_ENV" > .env
          printf '%s' "$GMAIL_CREDENTIALS" > credentials.json
          printf '%s' "$GMAIL_TOKEN" > token.json
          if [ -f state.json.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TIDI_STATE_KEY \
                 -in state.json.enc -out state.json 2>/dev/null; then
              echo "Memory restored."
            else
              echo "::warning title=Tidi::Couldn't unlock the saved memory (was TIDI_STATE_KEY changed?). Starting fresh."
              rm -f state.json
            fi
          fi
          if [ ! -f state.json ] && [ -n "$TIDI_STATE" ]; then
            printf '%s' "$TIDI_STATE" > state.json
            echo "Started from the TIDI_STATE secret."
          fi

      - name: Run Tidi once
        # A run you start by hand always sends a report, so you can see it working.
        run: python tidi.py --once ${{ github.event_name == 'workflow_dispatch' && '--report' || '' }}

      - name: Encrypt Tidi's memory
        if: always()
        env:
          TIDI_STATE_KEY: ${{ secrets.TIDI_STATE_KEY }}
        run: |
          rm -f state.json.enc
          if [ -f state.json ] && [ -n "$TIDI_STATE_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TIDI_STATE_KEY \
              -in state.json -out state.json.enc
          fi

      - name: Save Tidi's memory (encrypted)
        if: always() && hashFiles('state.json.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json.enc
          key: tidi-secure-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove private files
        if: always()
        run: rm -f .env credentials.json token.json state.json tidi.log
